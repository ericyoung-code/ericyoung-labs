[build-system]
# Tells GitHub Actions how to package your code
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ericyoung-labs"  # Your PyPI project name
version = "0.1.0"        # Follow semantic versioning (v0.1.0)
description = "An open-source security tool for information systems auditing"
authors = [
    { name = "Eric Young", email = "ericyoung@russtec.com" }
]
readme = "README.md"     # This content will appear on your PyPI page
requires-python = ">=3.8"
keywords = ["security", "audit", "infosec", "open-source"]
# Classifiers help the community find your tool on PyPI
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

# Important for your certification: links the community back to your code
[project.urls]
Homepage = "https://github.com/ericyoung-code/ericyoung-labs"
Issues = "https://github.com/ericyoung-code/ericyoung-labs/issues"

[project.scripts]
# This allows users to run your tool by typing 'ericyoung-labs' in their terminal
ericyoung-labs = "ericyoung_labs.main:main"
